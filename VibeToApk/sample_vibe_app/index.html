<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VibeFocus • Pomodoro & Habit</title>
  <!-- iOS Standalone App Support (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VibeFocus">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    body {
      background: #090d16;
      color: #ffffff;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    /* Glow circles */
    .glow-bg {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-6 relative">
  <div class="glow-bg"></div>

  <!-- App Header -->
  <header class="flex justify-between items-center z-10 pt-2">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <span class="text-lg">⚡</span>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight">VibeFocus</h1>
        <p class="text-[11px] text-slate-400 font-medium">Vibe Coding Demo App</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="streak-badge" class="px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs font-bold flex items-center gap-1">
        🔥 <span>3 Day Streak</span>
      </span>
    </div>
  </header>

  <!-- Central Circular Timer -->
  <main class="flex flex-col items-center justify-center my-auto z-10 py-6">
    <!-- Mode Tabs -->
    <div class="flex bg-slate-900/80 p-1 rounded-2xl border border-slate-800 mb-8 backdrop-blur-md">
      <button onclick="setMode('work')" id="tab-work" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-md">Tập trung (25m)</button>
      <button onclick="setMode('short')" id="tab-short" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 transition-all hover:text-white">Nghỉ ngắn (5m)</button>
      <button onclick="setMode('long')" id="tab-long" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 transition-all hover:text-white">Nghỉ dài (15m)</button>
    </div>

    <!-- Timer Circle -->
    <div class="relative w-64 h-64 flex items-center justify-center">
      <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
        <!-- Background Track -->
        <circle cx="50" cy="50" r="44" stroke="rgba(255, 255, 255, 0.06)" stroke-width="6" fill="none" />
        <!-- Progress Track -->
        <circle id="timer-progress" cx="50" cy="50" r="44" stroke="url(#timer-grad)" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="276.46" stroke-dashoffset="0" class="transition-all duration-300" />
        <defs>
          <linearGradient id="timer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
          </linearGradient>
        </defs>
      </svg>

      <!-- Center Time Display -->
      <div class="absolute flex flex-col items-center text-center">
        <span id="time-display" class="text-5xl font-black tracking-tight text-white drop-shadow-md">25:00</span>
        <span id="status-label" class="text-xs uppercase tracking-widest text-indigo-400 font-bold mt-1">SẴN SÀNG</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-4 mt-8">
      <button onclick="toggleTimer()" id="btn-play" class="w-16 h-16 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-2xl flex items-center justify-center shadow-xl shadow-indigo-500/40 active:scale-95 transition-all">
        ▶
      </button>
      <button onclick="resetTimer()" class="w-12 h-12 rounded-2xl bg-slate-800/80 border border-slate-700/80 text-slate-300 text-lg flex items-center justify-center active:scale-95 transition-all">
        ↺
      </button>
    </div>
  </main>

  <!-- Quick Tasks / Stats -->
  <footer class="z-10 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 backdrop-blur-xl">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-bold text-slate-300">Nhiệm vụ hôm nay</span>
      <span class="text-[11px] text-indigo-400 font-semibold cursor-pointer" onclick="addTask()">+ Thêm việc</span>
    </div>
    <div id="task-list" class="space-y-2 max-h-28 overflow-y-auto pr-1">
      <div class="flex items-center justify-between bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/50 text-xs">
        <div class="flex items-center gap-2">
          <input type="checkbox" class="rounded accent-indigo-500 w-4 h-4 cursor-pointer">
          <span class="text-slate-200">Vibe code xong ý tưởng video mới</span>
        </div>
        <span class="text-[10px] text-slate-400">25m</span>
      </div>
      <div class="flex items-center justify-between bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/50 text-xs">
        <div class="flex items-center gap-2">
          <input type="checkbox" checked class="rounded accent-indigo-500 w-4 h-4 cursor-pointer">
          <span class="line-through text-slate-500">Đóng gói Web thành file APK</span>
        </div>
        <span class="text-[10px] text-emerald-400 font-bold">Xong</span>
      </div>
    </div>
  </footer>

  <script>
    let totalSeconds = 25 * 60;
    let remainingSeconds = totalSeconds;
    let timerInterval = null;
    let isRunning = false;
    const circleLength = 276.46;

    const display = document.getElementById('time-display');
    const progress = document.getElementById('timer-progress');
    const btnPlay = document.getElementById('btn-play');
    const statusLabel = document.getElementById('status-label');

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const offset = circleLength - (remainingSeconds / totalSeconds) * circleLength;
      progress.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btnPlay.textContent = '▶';
        statusLabel.textContent = 'TẠM DỪNG';
        statusLabel.className = 'text-xs uppercase tracking-widest text-amber-400 font-bold mt-1';
      } else {
        isRunning = true;
        btnPlay.textContent = '⏸';
        statusLabel.textContent = 'ĐANG TẬP TRUNG';
        statusLabel.className = 'text-xs uppercase tracking-widest text-emerald-400 font-bold mt-1';
        timerInterval = setInterval(() => {
          if (remainingSeconds > 0) {
            remainingSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            btnPlay.textContent = '▶';
            statusLabel.textContent = 'HOÀN THÀNH!';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            alert('🎉 Chúc mừng! Bạn đã hoàn thành phiên tập trung!');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = totalSeconds;
      btnPlay.textContent = '▶';
      statusLabel.textContent = 'SẴN SÀNG';
      statusLabel.className = 'text-xs uppercase tracking-widest text-indigo-400 font-bold mt-1';
      updateDisplay();
    }

    function setMode(mode) {
      document.querySelectorAll('#tab-work, #tab-short, #tab-long').forEach(b => {
        b.className = 'px-4 py-2 rounded-xl text-xs font-medium text-slate-400 transition-all hover:text-white';
      });

      if (mode === 'work') {
        totalSeconds = 25 * 60;
        document.getElementById('tab-work').className = 'px-5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-md';
      } else if (mode === 'short') {
        totalSeconds = 5 * 60;
        document.getElementById('tab-short').className = 'px-5 py-2 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-md';
      } else if (mode === 'long') {
        totalSeconds = 15 * 60;
        document.getElementById('tab-long').className = 'px-5 py-2 rounded-xl text-xs font-bold transition-all bg-purple-600 text-white shadow-md';
      }
      resetTimer();
    }

    function addTask() {
      const task = prompt('Nhập tên nhiệm vụ cần tập trung:');
      if (task) {
        const list = document.getElementById('task-list');
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/50 text-xs';
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" class="rounded accent-indigo-500 w-4 h-4 cursor-pointer">
            <span class="text-slate-200">${task}</span>
          </div>
          <span class="text-[10px] text-slate-400">25m</span>
        `;
        list.prepend(item);
      }
    }

    updateDisplay();
  </script>
</body>
</html>
