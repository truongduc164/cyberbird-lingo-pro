plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dean.cyberbirdlingo'
    compileSdk 34

    defaultConfig {
        applicationId "com.dean.cyberbirdlingo"
        minSdk 21
        targetSdk 34
        versionCode 240
        versionName "2.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
