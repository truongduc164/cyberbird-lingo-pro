plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deanoptimize.cyberbirdlingo'
    compileSdk 34

    defaultConfig {
        applicationId "com.deanoptimize.cyberbirdlingo"
        minSdk 21
        targetSdk 34
        versionCode 300
        versionName "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
